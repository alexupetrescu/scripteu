# Include inside the EXISTING server { } block for avestudio.ro — this is a
# location snippet, not a server block, so it will not disturb the other apps:
#
#   include /etc/nginx/snippets/scripteu.conf;
#
# Two locks guard it: HTTP basic auth here, and a Django login behind it. The
# app holds a live admin session for a real ESC organisation and has a button
# that messages real people, so neither is decorative.

location = /scripteu {
    return 301 /scripteu/;
}

# "^~", not a plain prefix: it wins outright and stops nginx evaluating regex
# locations. A host that already routes with something like
# `location ~ ^/(admin|api)` is one regex away from swallowing these paths, and
# this app's own admin lives at /scripteu/admin/.
# The login browser, shown inside the app's Settings page. WebSocket, so it
# needs the Upgrade headers and a long read timeout.
#
# Note what guards this: basic auth only. It is not a Django view, so the
# app's own login does not apply -- and anyone who reaches it is driving a
# real browser on this server. Keep the htpasswd tight.
location ^~ /scripteu/vnc/ {
    auth_basic "ESC Outreach";
    auth_basic_user_file /etc/nginx/scripteu.htpasswd;

    proxy_pass http://127.0.0.1:6081/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /scripteu/static/ {
    alias /srv/scripteu/staticfiles/;
    access_log off;
    expires 7d;
}

location ^~ /scripteu/ {
    auth_basic "ESC Outreach";
    auth_basic_user_file /etc/nginx/scripteu.htpasswd;

    # The trailing ":/" strips the /scripteu/ prefix before proxying, so Django
    # resolves against "/". FORCE_SCRIPT_NAME=/scripteu puts the prefix back on
    # every URL the app generates. Both halves are required; remove either and
    # you get 404s or links to nowhere.
    proxy_pass http://unix:/run/scripteu/gunicorn.sock:/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Without this Django builds http:// redirects and refuses secure cookies.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Runs are driven from a background thread and the page merely polls, so
    # requests stay short. This is headroom, not a run timeout.
    proxy_read_timeout 120s;
    client_max_body_size 4m;
}
